[package]
name = "cortex"
version = "0.1.0"
edition = "2021"
description = "Persistent semantic memory layer for Copilot — compress, index, remember, serve"

[[bin]]
name = "cortex"
path = "src/main.rs"

[dependencies]
anyhow      = "1.0"
chrono      = { version = "0.4", features = ["serde"] }
clap        = { version = "4.0", features = ["derive"] }
dirs        = "5.0"
notify      = "6.0"
proc-macro2 = "1.0"
quote       = "1.0"
rusqlite    = { version = "0.31", features = ["bundled"] }
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
toml        = "0.8"
syn         = { version = "2.0", features = ["full", "extra-traits", "visit"] }
walkdir     = "2.0"
flate2      = "1.0"
sha2        = "0.10"
hex         = "0.4"
# The extraction core. Linked rather than shelled out to, so cortex and
# quartz-ctx parse the code through one front end and cannot disagree.
quartz-ctx  = { path = "../quartz-ctx" }

# The MCP configs run the DEV build, so its speed is every agent's latency.
# opt-level 1 measured 3-10x faster per tool call (get_context 454 -> 43 ms,
# semantic_search 105 -> 10 ms) and keeps debuginfo; the price is a slower
# first build and some variables optimised out in a debugger.
[profile.dev]
opt-level = 1

# Optimise dependencies even in the dev build the MCP config runs. The bundled
# SQLite and the tree-sitter grammars are C, compiled at -O0 otherwise, which
# made an in-request re-index several times slower for no debugging benefit -
# nobody steps through sqlite3.c. cortex's own code stays unoptimised.
[profile.dev.package."*"]
opt-level = 2
